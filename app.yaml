# Static site on App Engine standard: every request is served by a static
# handler, so the runtime never starts. Deploy with `npm run deploy`.
runtime: python312

handlers:
  - url: /
    static_files: dist/index.html
    upload: dist/index.html
    secure: always
    redirect_http_response_code: 301
  - url: /fr/?
    static_files: dist/fr/index.html
    upload: dist/fr/index.html
    secure: always
    redirect_http_response_code: 301
  - url: /fonts/(.*)
    static_files: dist/fonts/\1
    upload: dist/fonts/.*
    secure: always
    redirect_http_response_code: 301
    expiration: 365d
  - url: /(.*)
    static_files: dist/\1
    upload: dist/(.*)
    secure: always
    redirect_http_response_code: 301
